# main is the release branch: the same checks as ci, then www/ is published as storyboards.sgit.ai.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SGit-AI/SGit-AI__Website__Storyboards__API
          # every release folder stays on the API's main for ever, so main always holds the pinned one; the repository
          # variable STORYBOARDS_API_REF can name another ref while a new release is still on a branch there
          ref: ${{ vars.STORYBOARDS_API_REF || 'main' }}
          path: .api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          STORYBOARDS_API: ${{ github.workspace }}/.api
        run: python3 admin/build/build.py --check && python3 admin/build/validate.py
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
